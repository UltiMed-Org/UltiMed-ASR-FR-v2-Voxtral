services:
  crispasr:
    container_name: crispasr
    # image: ${CRISPASR_IMAGE:-crispasr-local:main}
    image: ghcr.io/crispstrobe/crispasr:main-cuda
    # build:
    #   context: .
    #   # dockerfile: .devops/main.Dockerfile
    #   dockerfile: .devops/main-cuda.Dockerfile
    ports:
      - "8002:8080"
    user: "${CRISPASR_UID:-1000}:${CRISPASR_GID:-1000}"
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./models_ignore_backups/:/models
      - ./cache:/cache
    environment:
      # - CRISPASR_PORT=8002
      # --- Active backend: parakeet ---
      # No local parakeet.gguf here, so AUTO_DOWNLOAD=1 makes the entrypoint pass
      # "-m auto" and fetch cstr/parakeet-tdt-0.6b-v3-GGUF (~467MB) on first run.
      # CRISPASR_MODEL is ignored while AUTO_DOWNLOAD=1.
      - CRISPASR_BACKEND=parakeet
      - CRISPASR_AUTO_DOWNLOAD=1
      # --- Alternative: local voxtral 4B (uncomment both, and set AUTO_DOWNLOAD=0) ---
      # The 4B GGUF needs the voxtral4b backend; plain "voxtral" is the smaller
      # 2.5GB standard variant. With AUTO_DOWNLOAD=0 the entrypoint uses the local
      # file in CRISPASR_MODEL instead of downloading the registry model.
      # - CRISPASR_BACKEND=voxtral4b
      # - CRISPASR_MODEL=/models/voxtral_4b_q2_K.gguf
      - CRISPASR_LANGUAGE=auto
      - CRISPASR_API_KEYS=CHANGE_ME_set_your_own_key
      # Pyannote diarization: https://github.com/CrispStrobe/CrispASR/blob/main/docs/cli.md#diarization
      # No surrounding quotes: the entrypoint runs eval "args+=($CRISPASR_EXTRA_ARGS)",
      # so quotes collapse the whole string into one argument (that broke startup).
      - CRISPASR_EXTRA_ARGS=--verbose --diarize --diarize-method pyannote --sherpa-segment-model auto
      - CRISPASR_DIAGNOSTICS=0
      # KV-cache quant is transformer-only (voxtral); parakeet is CTC/TDT with no
      # KV cache, so these are no-ops here. Re-enable when switching to voxtral.
      # - CRISPASR_KV_QUANT_V=q8_0
      # - CRISPASR_KV_QUANT_K=q8_0
      - CRISPASR_GGUF_PRELOAD=1
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    # Resource limits - all tunable via environment variables with sensible defaults.
    # CPU limits are expressed as number of cores (float), memory as Docker size strings (e.g. 8G).
    deploy:
      resources:
        limits:
          # Hard cap on CPU cores the container may consume
          cpus: 2
          # Hard cap on RAM
          memory: 8G
        reservations:
          # Minimum CPU cores guaranteed to the container
          # cpus: 1
          # # Minimum RAM guaranteed to the container
          # memory: 1G
          devices:
            # Grant access to all NVIDIA GPUs; set CRISPASR_GPU_COUNT to an
            # integer (e.g. 1) to restrict to a specific number of GPUs.
            - driver: nvidia
              count: ${CRISPASR_GPU_COUNT:-all}
              capabilities: [gpu]
    restart: unless-stopped
    pull_policy: always
    labels:
      - "com.centurylinklabs.watchtower.scope=autoupdate"

  # Voxtral TTS (text->audio) via vLLM, NOT CrispASR. Model:
  # mistralai/Voxtral-4B-TTS-2603, served by vllm-omni. This is a separate
  # runtime from the crispasr image, so it gets its own image built from
  # voxtral/Dockerfile (which pins vllm==0.18.1 + vllm-omni==0.18.0 to
  # match voxtral/install.sh). Client: voxtral/query_test.py, e.g.
  #   uv run voxtral/query_test.py --input "Bonjour." --voice neutral_female
  # It POSTs to :8003/v1/audio/speech, same as any OpenAI TTS client.
  #
  # Start it with:  sudo docker compose up -d --build voxtral-tts
  # NOTE: it binds host :8003, the SAME port as crispasr-tts (TADA). Only one TTS
  # service can be up at a time; stop crispasr-tts before starting this one.
  voxtral-tts:
    container_name: voxtral-tts
    build:
      context: ./voxtral
      dockerfile: Dockerfile
      # Bake a passwd entry for the runtime uid/gid so vLLM's getpass.getuser()
      # lookup does not crash ("getpwuid(): uid not found"). Keep these in sync
      # with the `user:` line below.
      args:
        APP_UID: ${CRISPASR_UID:-1000}
        APP_GID: ${CRISPASR_GID:-1000}
    image: voxtral-tts-local:0.18.1
    ports:
      - "8003:8003"
    # Run as the host user (matches the crispasr services) and keep every cache
    # under the mounted ./cache so downloaded weights (~9GB) survive restarts and
    # stay host-visible/host-owned instead of landing in a root-owned /root.
    user: "${CRISPASR_UID:-1000}:${CRISPASR_GID:-1000}"
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./cache:/cache
    environment:
      - HOME=/cache
      - HF_HOME=/cache/huggingface
      - XDG_CACHE_HOME=/cache
      # If the model repo is gated on Hugging Face, pass a token:
      # - HF_TOKEN=TODO
      # entrypoint.sh reads the tuning vars below at boot; the first three patch the
      # copied stage-config YAML, the last two toggle/append serve flags. Changing
      # any value needs no rebuild, just `up -d`. See the Voxtral TTS section in
      # CLAUDE.md for the two-stage explanation.
      # Shrink GPU memory use when sharing the card with crispasr/crispasr-tts
      # (install.sh used 0.35). Only affects the AR stage (the ~0.8 hog); leave
      # unset to keep the packaged default (0.8):
      # - VLLM_GPU_MEM_UTIL=0.35
      # Acoustic-decoder sampling temperature (entrypoint default is 0.7, lowered
      # from upstream 0.9 for steadier audio; raise toward 0.9 for more expressive):
      # - VOXTRAL_ACOUSTIC_TEMP=0.7
      # Seed for both stages: fixed = reproducible; change for a different take:
      # - VOXTRAL_SEED=42
      # Eager mode (default 1 = on, --enforce-eager: less VRAM, faster start, a bit
      # slower). Set 0 to let the AR stage capture CUDA graphs (faster generation,
      # more VRAM + a first-boot capture delay):
      # - VOXTRAL_ENFORCE_EAGER=1
      # Extra vllm-omni serve flags, space-separated (opt-in; do not quote-wrap):
      # - VLLM_EXTRA_ARGS=--max-model-len 4096
    # vLLM needs a large /dev/shm for its tensor/NCCL buffers.
    shm_size: "8gb"
    healthcheck:
      # vLLM exposes /health; use python3 (curl may be absent in the vllm image).
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/health')\" >/dev/null 2>&1"]
      interval: 30s
      timeout: 5s
      retries: 5
      # First boot downloads ~9GB of weights, so allow a long warmup.
      start_period: 300s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${CRISPASR_GPU_COUNT:-all}
              capabilities: [gpu]
    restart: unless-stopped

  crispasr-tts:
    container_name: crispasr-tts
    # OpenAI-compatible TTS server (POST /v1/audio/speech). The active backend
    # is chosen in `environment:` below (currently Chatterbox); VoxCPM2,
    # Qwen3-TTS variants and TADA are kept as commented alternatives. See:
    #   https://github.com/CrispStrobe/CrispASR/blob/main/docs/tts.md
    image: ghcr.io/crispstrobe/crispasr:main-cuda
    # To build from source instead of pulling the image, uncomment:
    # build:
    #   context: ./CrispASR_source
    #   dockerfile: .devops/main-cuda.Dockerfile
    ports:
      - "8003:8080"
    user: "${CRISPASR_UID:-1000}:${CRISPASR_GID:-1000}"
    security_opt:
      - no-new-privileges:true
    volumes:
      # The whole TTS-models dir is mounted at /models, so every local backend
      # (each Qwen3-TTS subdir AND the TADA baked refs) is reachable without
      # changing this line: only the CRISPASR_MODEL path in `environment:`
      # picks which one loads. /cache holds anything AUTO_DOWNLOAD=1 fetches
      # (the TADA weights, or the Qwen3-TTS-Base model for cloning).
      - ./models_tts_ignore_backups/:/models
      - ./cache:/cache
      # For Qwen3-TTS-Base voice CLONING only (see the commented Base block in
      # environment: below): mount the reference-clip dir so <name>.wav +
      # <name>.txt sidecars are reachable at /voices, then set --voice-dir
      # /voices. NOTE: Qwen cloning needs a .wav (the .ogg refs here are NOT
      # accepted), so transcode first, e.g.
      #   ffmpeg -i voices/alicia2.ogg -ar 16000 -ac 1 voices/alicia2.wav
      # - ./voices/:/voices:ro
    environment:
      # --- ALT backend: VoxCPM2 (openbmb/VoxCPM2, diffusion AR TTS) --------
      # Qwen2-2B backbone + flow matching + BigVGAN @ 48kHz (decimated to 24kHz),
      # 30 languages, tokenizer-free. Single GGUF, so AUTO_DOWNLOAD=1 fetches
      # voxcpm2-q4_k.gguf (~1.6GB) into /cache on first boot (no companion / no
      # --codec-model). Synthesis is ZERO-SHOT by default (no reference needed,
      # so `tts.py --check` and bare `-t` work); voice cloning is opt-in per
      # request with `tts.py --voice /path/ref.wav`.
      # Runs full GPU by default (the earlier "illegal memory access" was on
      # Chatterbox, not here, so no CPU-forcing knobs are set). If VoxCPM2
      # DOES crash on CUDA, uncomment the two #164 workarounds below:
      #  1) VOXCPM2_NO_BUCKET=1 -- ggml_set_rows corrupts the KV cache on the
      #     2nd AR step via the bucketed TSLM path. Already AUTO-disabled on
      #     CUDA in current `main`; this forces it off on every backend as a
      #     belt-and-suspenders in case backend-name detection misses.
      #  2) VOXCPM2_FA_CPU=1 -- flash_attn_ext F16 accumulator OVERFLOWS on
      #     mu-conditioned attention from the 2nd AR step (seen on P100); runs
      #     LocDiT/LocEnc on CPU to dodge it. NOT auto-handled, so this is the
      #     one to try first if you hit an illegal-memory-access here.
      # - CRISPASR_BACKEND=voxcpm2-tts
      # - CRISPASR_AUTO_DOWNLOAD=1
      # - CRISPASR_LANGUAGE=fr
      # - CRISPASR_EXTRA_ARGS=--verbose
      # - VOXCPM2_FA_CPU=1
      # - VOXCPM2_NO_BUCKET=1
      # Diagnostics: VOXCPM2_BUCKET_CUDA=1 re-enables buckets on CUDA (bench),
      # VOXCPM2_NAN_CHECK=1 reads every tensor back to CPU to locate NaNs (slow),
      # VOXCPM2_USE_GRAPH=0 forces the CPU VAE encoder path.
      #
      # --- ACTIVE backend: Chatterbox (ResembleAI, multilingual v3) --------
      # Two-GGUF flow-matching pipeline: T3 (AR text -> speech tokens) + S3Gen
      # (flow-matching tokens -> 24kHz audio via HiFTGenerator). Not local, so
      # AUTO_DOWNLOAD=1 fetches BOTH GGUFs (~880MB) into /cache on first boot;
      # the S3Gen companion is auto-resolved (no --codec-model). The default
      # voice is baked into the T3 GGUF, so it speaks out of the box (no
      # instruct, no reference) and `tts.py --check` passes. -l fr selects the
      # French language token (wired into the T3 prompt, not the spoken text;
      # quality is model-dependent, treat it as a wiring check).
      # GPU split (CORRECTION): on this CUDA image the current default runs
      # BOTH T3 and S3Gen on GPU (chatterbox.cpp: t3_gpu_default=true,
      # s3gen_use_gpu=true). S3Gen on CUDA is the fragile half -- its UNet
      # mul_mat accumulates in F16 (wmma), and the HiFTGenerator FFT hit a
      # heap overflow on P100 -- which is the "illegal memory access" you saw.
      # FIX: CRISPASR_CHATTERBOX_S3GEN_CPU=1 keeps T3 on GPU (fast, the "better"
      # half) and moves S3Gen to CPU (stable). That is the recommended setting
      # here and matches the "prefer T3" preference; it is set below.
      # Bigger hammer if needed: CRISPASR_CHATTERBOX_FULL_CPU=1 (both on CPU).
      # Avoid CRISPASR_CHATTERBOX_FORCE_GPU=1 (forces S3Gen back onto the GPU).
      # Optional CRISPASR_CHATTERBOX_THREADS=<n> caps the S3Gen CPU threads.
      # Docs: https://github.com/CrispStrobe/CrispASR/blob/main/docs/tts.md#chatterbox
      - CRISPASR_BACKEND=chatterbox
      - CRISPASR_AUTO_DOWNLOAD=1
      - CRISPASR_LANGUAGE=fr
      - CRISPASR_EXTRA_ARGS=--verbose
      - CRISPASR_CHATTERBOX_S3GEN_CPU=1   # T3 on GPU, S3Gen on CPU -> fixes the CUDA crash
      # Sibling fine-tunes share the runtime (all AUTO_DOWNLOAD=1); swap the backend:
      # - CRISPASR_BACKEND=chatterbox-turbo    # distilled English, faster 2-step S3Gen
      # - CRISPASR_BACKEND=kartoffelbox-turbo  # German turbo (set CRISPASR_LANGUAGE=de)
      # - CRISPASR_BACKEND=lahgtna-chatterbox  # Arabic (set CRISPASR_LANGUAGE=ar)
      # Voice cloning (later): bake a voice GGUF from a reference clip with
      # CrispASR_source/models/bake-chatterbox-voice-from-wav.py, or pass a
      # 24kHz mono WAV directly (a 16kHz WAV is NOT a real clone -- re-encode:
      # ffmpeg -i in -ar 24000 -ac 1 ref.wav). Then `tts.py --voice my_voice.gguf`
      # (per-request cached, switchable without a restart).
      #
      # =====================================================================
      # Qwen3-TTS family: three DISTINCT 1.7B variants, selected purely by the
      # GGUF that CRISPASR_MODEL points at (the backend name maps them all to
      # the same qwen3-tts adapter; the variant is read from the model's
      # `qwen3tts.tts_model_type` metadata). All three talker GGUFs + the shared
      # 12Hz tokenizer are already local, so AUTO_DOWNLOAD=0 (no fetch):
      #   - VoiceDesign : describe a voice in prose (--instruct / API `instructions`);
      #                   no reference audio, no preset speaker. -> tts.py -i "..."
      #   - CustomVoice : 9 baked premium timbres, picked by NAME (--voice <name>),
      #                   with optional style steering via --instruct. -> tts.py --voice <name>
      #   - Base        : true voice CLONING from your own audio (WAV + transcript).
      #                   NOT downloaded here; see the Base block far below.
      # Docs: https://github.com/CrispStrobe/CrispASR/blob/main/docs/tts.md
      # =====================================================================
      #
      # --- ALT backend: Qwen3-TTS-VoiceDesign 1.7B ------------------------
      # VoiceDesign has no preset voice: it MANDATES an instruct, so bare
      # requests (and `tts.py --check`) would 500 without one. The baked
      # default --instruct below is the startup fallback; per request,
      # `tts.py -i "<description>"` overrides it (the server's usual
      # startup-default / per-request-override contract). The description can be
      # English or French and steers timbre/age/pace/accent, NOT the spoken
      # text (that is the -t input). CRISPASR_LANGUAGE=fr sets the codec OUTPUT
      # language (French); change it to synthesize another language.
      # - CRISPASR_BACKEND=qwen3-tts-1.7b-voicedesign
      # - CRISPASR_MODEL=/models/qwen3-tts-12hz-1.7b-voicedesign/qwen3-tts-12hz-1.7b-voicedesign-q8_0.gguf
      # - CRISPASR_AUTO_DOWNLOAD=0
      # - CRISPASR_LANGUAGE=fr
      # - CRISPASR_EXTRA_ARGS=--codec-model /models/qwen3-tts-12hz-1.7b-voicedesign/qwen3-tts-tokenizer-12hz.gguf --verbose --instruct "A warm natural adult female voice, calm and clear, at a moderate pace"
      # Optional: pin the AR sampling seed for reproducible takes (default 42):
      # - QWEN3_TTS_SEED=2
      #
      # --- ALT backend: Qwen3-TTS-CustomVoice 1.7B (9 preset timbres) ------
      # Pick a speaker by NAME per request: `tts.py --voice vivian`. The 9 baked
      # names are: aiden, dylan, eric, ono_anna, ryan, serena, sohee, uncle_fu,
      # vivian (dylan/eric carry Chinese-dialect overrides). Passing a .wav/.gguf
      # here does NOT clone; it warns and falls back to the first speaker (use the
      # Base variant to clone). --instruct is optional style control on 1.7B.
      # - CRISPASR_BACKEND=qwen3-tts-1.7b-customvoice
      # - CRISPASR_MODEL=/models/qwen3-tts-12hz-1.7b-customvoice/qwen3-tts-12hz-1.7b-customvoice-q8_0.gguf
      # - CRISPASR_AUTO_DOWNLOAD=0
      # - CRISPASR_LANGUAGE=fr
      # - CRISPASR_EXTRA_ARGS=--codec-model /models/qwen3-tts-12hz-1.7b-customvoice/qwen3-tts-tokenizer-12hz.gguf --verbose
      #
      # --- ALT backend: Qwen3-TTS-Base 1.7B (voice CLONING) ---------------
      # This is the ONLY Qwen variant that clones your own voice. It is not
      # local, so AUTO_DOWNLOAD=1 fetches the base talker (~1.9GB) + tokenizer
      # into /cache. Cloning contract: reference audio must be a .wav (the .ogg
      # refs are rejected) plus its transcript. Easiest per-request path: mount
      # ./voices at /voices (see volumes above) and set --voice-dir /voices;
      # then a bare `tts.py --voice alicia2` resolves /voices/alicia2.wav and
      # auto-reads /voices/alicia2.txt as the ref-text (no consent field needed).
      # Prep the wav once:  ffmpeg -i voices/alicia2.ogg -ar 16000 -ac 1 voices/alicia2.wav
      # - CRISPASR_BACKEND=qwen3-tts-1.7b-base
      # - CRISPASR_AUTO_DOWNLOAD=1
      # - CRISPASR_LANGUAGE=fr
      # - CRISPASR_EXTRA_ARGS=--verbose --voice-dir /voices
      #
      # --- ALT backend: TADA 3B multilingual (French) ---------------------
      # The previous active TTS. Backend MUST be "tada" (the -m auto registry key
      # for HumeAI/tada-3b-ml; "tada-3b-ml" is NOT a registry key). AUTO_DOWNLOAD=1
      # fetches tada-tts-3b-ml-f16.gguf (~8GB) + tada-codec-f16.gguf (~1GB) + the
      # default English tada-ref.gguf into /cache (codec auto-discovered, no
      # --codec-model). --voice pins the startup-default reference; it is also
      # switchable per request (#201). For TADA, -l fr only selects the voice ref
      # when no --voice is given. See the TADA_* acoustic knobs in CLAUDE.md.
      # - CRISPASR_BACKEND=tada
      # - CRISPASR_AUTO_DOWNLOAD=1
      # - CRISPASR_LANGUAGE=fr
      # - CRISPASR_EXTRA_ARGS=--verbose --voice /models/tada-ref-alicia.gguf
      # - TADA_NUM_CANDIDATES=8
      # - TADA_NUM_FM_STEPS=10
      # - TADA_ACOUSTIC_CFG=1.6
      # - TADA_NOISE_TEMP=0.9
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: 2
          memory: 8G
        reservations:
          devices:
            - driver: nvidia
              count: ${CRISPASR_GPU_COUNT:-all}
              capabilities: [gpu]
    restart: unless-stopped
    pull_policy: always
    labels:
      - "com.centurylinklabs.watchtower.scope=autoupdate"
