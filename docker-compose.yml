services:
  crispasr:
    container_name: crispasr
    # image: ${CRISPASR_IMAGE:-crispasr-local:main}
    image: ghcr.io/crispstrobe/crispasr:main-cuda
    # build:
    #   context: .
    #   # dockerfile: .devops/main.Dockerfile
    #   dockerfile: .devops/main-cuda.Dockerfile
    ports:
      - "8002:8080"
    user: "${CRISPASR_UID:-1000}:${CRISPASR_GID:-1000}"
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./models_ignore_backups/:/models
      - ./cache:/cache
    environment:
      # - CRISPASR_PORT=8002
      # --- Active backend: parakeet ---
      # No local parakeet.gguf here, so AUTO_DOWNLOAD=1 makes the entrypoint pass
      # "-m auto" and fetch cstr/parakeet-tdt-0.6b-v3-GGUF (~467MB) on first run.
      # CRISPASR_MODEL is ignored while AUTO_DOWNLOAD=1.
      - CRISPASR_BACKEND=parakeet
      - CRISPASR_AUTO_DOWNLOAD=1
      # --- Alternative: local voxtral 4B (uncomment both, and set AUTO_DOWNLOAD=0) ---
      # The 4B GGUF needs the voxtral4b backend; plain "voxtral" is the smaller
      # 2.5GB standard variant. With AUTO_DOWNLOAD=0 the entrypoint uses the local
      # file in CRISPASR_MODEL instead of downloading the registry model.
      # - CRISPASR_BACKEND=voxtral4b
      # - CRISPASR_MODEL=/models/voxtral_4b_q2_K.gguf
      - CRISPASR_LANGUAGE=auto
      - CRISPASR_API_KEYS=CHANGE_ME_set_your_own_key
      # Pyannote diarization: https://github.com/CrispStrobe/CrispASR/blob/main/docs/cli.md#diarization
      # No surrounding quotes: the entrypoint runs eval "args+=($CRISPASR_EXTRA_ARGS)",
      # so quotes collapse the whole string into one argument (that broke startup).
      - CRISPASR_EXTRA_ARGS=--verbose --diarize --diarize-method pyannote --sherpa-segment-model auto
      - CRISPASR_DIAGNOSTICS=0
      # KV-cache quant is transformer-only (voxtral); parakeet is CTC/TDT with no
      # KV cache, so these are no-ops here. Re-enable when switching to voxtral.
      # - CRISPASR_KV_QUANT_V=q8_0
      # - CRISPASR_KV_QUANT_K=q8_0
      - CRISPASR_GGUF_PRELOAD=1
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    # Resource limits - all tunable via environment variables with sensible defaults.
    # CPU limits are expressed as number of cores (float), memory as Docker size strings (e.g. 8G).
    deploy:
      resources:
        limits:
          # Hard cap on CPU cores the container may consume
          cpus: 2
          # Hard cap on RAM
          memory: 8G
        reservations:
          # Minimum CPU cores guaranteed to the container
          # cpus: 1
          # # Minimum RAM guaranteed to the container
          # memory: 1G
          devices:
            # Grant access to all NVIDIA GPUs; set CRISPASR_GPU_COUNT to an
            # integer (e.g. 1) to restrict to a specific number of GPUs.
            - driver: nvidia
              count: ${CRISPASR_GPU_COUNT:-all}
              capabilities: [gpu]
    restart: unless-stopped
    pull_policy: always
    labels:
      - "com.centurylinklabs.watchtower.scope=autoupdate"

  crispasr-tts:
    container_name: crispasr-tts
    # OpenAI-compatible TTS server (POST /v1/audio/speech) backed by
    # Qwen3-TTS VoiceDesign. See:
    #   https://github.com/CrispStrobe/CrispASR/issues/86#issuecomment-4422827115
    #   https://huggingface.co/cstr/qwen3-tts-1.7b-voicedesign-GGUF
    # build:
    #   context: ./original_repo_for_quantization
    #   dockerfile: .devops/main-cuda.Dockerfile
    image: ghcr.io/crispstrobe/crispasr:main-cuda
    ports:
      - "8003:8080"
    user: "${CRISPASR_UID:-1000}:${CRISPASR_GID:-1000}"
    security_opt:
      - no-new-privileges:true
    volumes:
      # --- Qwen3-TTS (previous): mounted a local model dir at /models ---
      # - ./models_tts_ignore_backups/qwen3-tts-12hz-1.7b-voicedesign/:/models
      # - ./models_tts_ignore_backups/qwen3-tts-12hz-1.7b-customvoice/:/models
      # --- TADA: AUTO_DOWNLOAD=1 fetches model+codec+French ref into the
      #     --cache-dir (/cache), so no /models mount is needed. ---
      - ./cache:/cache
    environment:
      # --- Qwen3-TTS (previous) ---
      # - CRISPASR_MODEL=/models/qwen3-tts-12hz-1.7b-voicedesign-q8_0.gguf
      # - CRISPASR_BACKEND=qwen3-tts-1.7b-voicedesign
      # - CRISPASR_MODEL=/models/qwen3-tts-12hz-1.7b-customvoice-q8_0.gguf
      # - CRISPASR_BACKEND=qwen3-tts-1.7b-customvoice
      # - CRISPASR_AUTO_DOWNLOAD=0
      # - CRISPASR_EXTRA_ARGS=--codec-model /models/qwen3-tts-tokenizer-12hz.gguf --verbose
      # - QWEN3_TTS_SEED=2
      # --- Active backend: TADA 3B multilingual (French) ---
      # tada-1b is English-only; tada-3b-ml adds ar/ch/de/es/fr/it/ja/pl/pt.
      # AUTO_DOWNLOAD=1 -> entrypoint passes "-m auto --auto-download", fetching
      # the ~4GB Q4_K model + ~1GB codec into /cache on first run. No --codec-model
      # needed (TADA auto-discovers it, unlike qwen). CRISPASR_LANGUAGE=fr maps to
      # "-l fr", which also auto-downloads tada-ref-fr.gguf (the default French voice).
      # Docs: https://github.com/CrispStrobe/CrispASR/blob/main/docs/tts.md
      - CRISPASR_BACKEND=tada-3b-ml
      - CRISPASR_AUTO_DOWNLOAD=1
      - CRISPASR_LANGUAGE=fr
      - CRISPASR_EXTRA_ARGS=--verbose
      # Timing robustness (default 4); raise toward 8 if prosody rushes/garbles.
      # - TADA_NUM_CANDIDATES=4
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: 2
          memory: 8G
        reservations:
          devices:
            - driver: nvidia
              count: ${CRISPASR_GPU_COUNT:-all}
              capabilities: [gpu]
    restart: unless-stopped
    pull_policy: always
    labels:
      - "com.centurylinklabs.watchtower.scope=autoupdate"
